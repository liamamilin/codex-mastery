<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" viewBox="0 0 680 820" role="img" aria-labelledby="title desc"><title id="title">恢复之前，先辨认状态</title><desc id="desc">工作区：你正在编辑的文件：先看 git diff；保留需要的修改与备份。。暂存区：下一次提交准备记录的变化：看 git diff --cached；取消暂存不会删掉编辑。。提交历史：已经记录的版本：看 git log；公开历史中的撤销可用新提交表达。。恢复后的行为：文件内容正确，还要实际运行：确认目标恢复、旁支笔记仍在、功能未退化。</desc><rect width="680" height="820" rx="6" fill="#0b101c"/><g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><text x="30" y="37" fill="#7bc9dc" font-size="11" letter-spacing="2">CODEX MASTERY LAB / FIG. 05</text><text x="30" y="80" fill="#f2f6fc" font-size="27" font-weight="700">恢复之前，先辨认状态</text><text x="30" y="113" fill="#afbed0" font-size="14">Git 中不同位置的改变，不能用同一句“撤销”处理。</text><g transform="translate(30 155)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">01 / 工作区</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">你正在编辑的文件</text><text x="24" y="93" fill="#afbed0" font-size="14">先看 git diff；保留需要的修改与备份。</text></g><path d="M340 274v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 298)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">02 / 暂存区</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">下一次提交准备记录的变化</text><text x="24" y="93" fill="#afbed0" font-size="14">看 git diff --cached；取消暂存不会删掉编辑。</text></g><path d="M340 417v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 441)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">03 / 提交历史</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">已经记录的版本</text><text x="24" y="93" fill="#afbed0" font-size="14">看 git log；公开历史中的撤销可用新提交表达。</text></g><path d="M340 560v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 584)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">04 / 恢复后的行为</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">文件内容正确，还要实际运行</text><text x="24" y="93" fill="#afbed0" font-size="14">确认目标恢复、旁支笔记仍在、功能未退化。</text></g><path d="M30 752H650" stroke="#354456"/><text x="30" y="784" fill="#7bc9dc" font-size="12">第 14 章用独立临时仓库练习；不要在教材仓库试破坏性命令。</text></g></svg>