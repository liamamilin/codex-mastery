<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" viewBox="0 0 680 820" role="img" aria-labelledby="title desc"><title id="title">连接能力，要同时看三层</title><desc id="desc">宿主与授权：当前客户端、账号与项目范围：实际可见工具清单决定本次可用入口。。连接与工具：插件或 MCP 提供具体能力：先确认目标、参数、读写性质与返回范围。。任务动作：例如：只读获取公开仓库信息：从小范围检查开始，不把读权限推成写权限。。可用证据：实际返回、时间、适用边界：旧记录可复查，但不冒充当前在线状态。</desc><rect width="680" height="820" rx="6" fill="#0b101c"/><g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><text x="30" y="37" fill="#7bc9dc" font-size="11" letter-spacing="2">CODEX MASTERY LAB / FIG. 07</text><text x="30" y="80" fill="#f2f6fc" font-size="27" font-weight="700">连接能力，要同时看三层</text><text x="30" y="113" fill="#afbed0" font-size="14">有工具不等于需要调用；连接成功也不代表任意动作获准。</text><g transform="translate(30 155)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">01 / 宿主与授权</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">当前客户端、账号与项目范围</text><text x="24" y="93" fill="#afbed0" font-size="14">实际可见工具清单决定本次可用入口。</text></g><path d="M340 274v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 298)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">02 / 连接与工具</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">插件或 MCP 提供具体能力</text><text x="24" y="93" fill="#afbed0" font-size="14">先确认目标、参数、读写性质与返回范围。</text></g><path d="M340 417v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 441)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">03 / 任务动作</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">例如：只读获取公开仓库信息</text><text x="24" y="93" fill="#afbed0" font-size="14">从小范围检查开始，不把读权限推成写权限。</text></g><path d="M340 560v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 584)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">04 / 可用证据</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">实际返回、时间、适用边界</text><text x="24" y="93" fill="#afbed0" font-size="14">旧记录可复查，但不冒充当前在线状态。</text></g><path d="M30 752H650" stroke="#354456"/><text x="30" y="784" fill="#7bc9dc" font-size="12">没有连接时可读本地源码继续；不要为演示工具而扩大授权。</text></g></svg>