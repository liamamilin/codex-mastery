<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" viewBox="0 0 680 820" role="img" aria-labelledby="title desc"><title id="title">让下一次工作接得上</title><desc id="desc">记录起点：当前版本、输入位置与运行前提：另一个会话应能找到同一份工作。。保留证据：有效命令、真实结果与失败条件：区分已执行、未执行与仅供演示。。留下决策：为什么继续、换路或缩小范围：连同没有解决的问题一起保存。。重新确认：读取记录 → 检查现状 → 继续行动：有冲突时以当前事实修正旧记录。</desc><rect width="680" height="820" rx="6" fill="#0b101c"/><g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><text x="30" y="37" fill="#7bc9dc" font-size="11" letter-spacing="2">CODEX MASTERY LAB / FIG. 08</text><text x="30" y="80" fill="#f2f6fc" font-size="27" font-weight="700">让下一次工作接得上</text><text x="30" y="113" fill="#afbed0" font-size="14">保存的不只是结论，还有取得结论的依据。</text><g transform="translate(30 155)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">01 / 记录起点</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">当前版本、输入位置与运行前提</text><text x="24" y="93" fill="#afbed0" font-size="14">另一个会话应能找到同一份工作。</text></g><path d="M340 274v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 298)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">02 / 保留证据</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">有效命令、真实结果与失败条件</text><text x="24" y="93" fill="#afbed0" font-size="14">区分已执行、未执行与仅供演示。</text></g><path d="M340 417v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 441)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">03 / 留下决策</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">为什么继续、换路或缩小范围</text><text x="24" y="93" fill="#afbed0" font-size="14">连同没有解决的问题一起保存。</text></g><path d="M340 560v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 584)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">04 / 重新确认</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">读取记录 → 检查现状 → 继续行动</text><text x="24" y="93" fill="#afbed0" font-size="14">有冲突时以当前事实修正旧记录。</text></g><path d="M30 752H650" stroke="#354456"/><text x="30" y="784" fill="#7bc9dc" font-size="12">接续成功的标准：不依赖上一段对话，也能恢复有效行动。</text></g></svg>