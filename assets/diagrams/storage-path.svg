<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">刷新前后，数据从哪里来</title><desc id="desc">新增或删除先产生新列表，保存成功后才更新当前界面。刷新页面会重新从本地存储读取。只修改内存而漏掉保存，刷新后就会读取旧记录。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7bc9dc"/></marker></defs>
<rect width="960" height="580" rx="12" fill="#0e1522"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="44" y="46" font-size="12" letter-spacing="2" fill="#91a3b9">CODEX MASTERY LAB / FIG. 02</text><text x="44" y="91" font-size="30" font-weight="600" fill="#f2f6fc">刷新不是继续看，而是重新读。</text><text x="44" y="122" font-size="15" fill="#a9b7c7">用两份状态，理解“页面消失了”为什么还不够。</text>
<g fill="#182333" stroke="#3b4d63"><rect x="44" y="180" width="238" height="126" rx="5"/><rect x="361" y="180" width="238" height="126" rx="5"/><rect x="678" y="180" width="238" height="126" rx="5"/></g>
<g font-size="11" fill="#7bc9dc" letter-spacing="2"><text x="65" y="211">01 / CHANGE</text><text x="382" y="211">02 / PERSIST</text><text x="699" y="211">03 / RENDER</text></g>
<g font-size="23" font-weight="600" fill="#f2f6fc"><text x="65" y="250">产生新列表</text><text x="382" y="250">写入本地存储</text><text x="699" y="250">更新当前界面</text></g><g font-size="13" fill="#a9b7c7"><text x="65" y="280">新增 / 删除的目标状态</text><text x="382" y="280">成功后才能确认已保存</text><text x="699" y="280">内存与页面中的列表</text></g>
<g fill="none" stroke="#7bc9dc" stroke-width="1.5" marker-end="url(#a)"><path d="M288 243H351"/><path d="M605 243H668"/><path d="M796 316V373Q796 396 772 396H504Q480 396 480 373V316"/></g><rect x="565" y="376" width="170" height="40" fill="#0e1522"/><text x="650" y="401" text-anchor="middle" fill="#7bc9dc" font-size="16">刷新 → 重新读取</text>
<path d="M44 461H916" stroke="#314052"/><text x="44" y="498" fill="#ff997a" font-size="15" font-weight="600">故障分支：若跳过“写入本地存储”，刷新会重新读到旧列表。</text><text x="44" y="530" fill="#a9b7c7" font-size="14">验收路径：新增 → 刷新仍在 → 删除 → 刷新不再出现。</text><text x="44" y="560" fill="#8294aa" font-size="12">localStorage 属于当前浏览器与站点来源；它不是云同步，清理站点数据会删除记录。</text></g></svg>
