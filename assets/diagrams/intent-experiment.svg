<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" viewBox="0 0 680 820" role="img" aria-labelledby="title desc"><title id="title">把愿望变成能回答的问题</title><desc id="desc">愿望：“收藏以后，总找不到。”：先保留问题，不急着决定功能。。可区分的问题：是忘了保存，还是保存后难找？：两种问题需要不同的下一步。。最小可观察动作：保存 3 条，再用标题关键词找回 1 条。：只改变一个方向，记录能否完成。。决定：有帮助 → 继续；无帮助 → 重查假设。：“不确定”也是结果：说明还缺观察。</desc><rect width="680" height="820" rx="6" fill="#0b101c"/><g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><text x="30" y="37" fill="#7bc9dc" font-size="11" letter-spacing="2">CODEX MASTERY LAB / FIG. 02</text><text x="30" y="80" fill="#f2f6fc" font-size="27" font-weight="700">把愿望变成能回答的问题</text><text x="30" y="113" fill="#afbed0" font-size="14">先检验价值，再决定要不要扩大实现。</text><g transform="translate(30 155)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">01 / 愿望</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">“收藏以后，总找不到。”</text><text x="24" y="93" fill="#afbed0" font-size="14">先保留问题，不急着决定功能。</text></g><path d="M340 274v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 298)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">02 / 可区分的问题</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">是忘了保存，还是保存后难找？</text><text x="24" y="93" fill="#afbed0" font-size="14">两种问题需要不同的下一步。</text></g><path d="M340 417v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 441)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">03 / 最小可观察动作</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">保存 3 条，再用标题关键词找回 1 条。</text><text x="24" y="93" fill="#afbed0" font-size="14">只改变一个方向，记录能否完成。</text></g><path d="M340 560v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 584)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">04 / 决定</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">有帮助 → 继续；无帮助 → 重查假设。</text><text x="24" y="93" fill="#afbed0" font-size="14">“不确定”也是结果：说明还缺观察。</text></g><path d="M30 752H650" stroke="#354456"/><text x="30" y="784" fill="#7bc9dc" font-size="12">证据是具体使用结果；功能数量不能替代问题被解决。</text></g></svg>