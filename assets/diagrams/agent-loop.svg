<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">从模型回答到真实成果</title><desc id="desc">用户给出意图，模型选择行动，通过工具读取或修改工作区，实际结果再反馈给用户。模型的陈述、工具返回、文件变化和使用验证是不同证据。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7bc9dc"/></marker></defs>
<rect width="960" height="600" rx="12" fill="#0e1522"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="44" y="46" font-size="12" letter-spacing="2" fill="#91a3b9">CODEX MASTERY LAB / FIG. 01</text><text x="44" y="91" font-size="30" font-weight="600" fill="#f2f6fc">一句回答，如何走向真实成果？</text><text x="44" y="122" font-size="15" fill="#a9b7c7">沿着行动路径，看清每一种证据。</text>
<g fill="#182333" stroke="#3b4d63"><rect x="44" y="181" width="186" height="150" rx="5"/><rect x="272" y="181" width="186" height="150" rx="5"/><rect x="500" y="181" width="186" height="150" rx="5"/><rect x="728" y="181" width="186" height="150" rx="5"/></g>
<g font-size="11" fill="#7bc9dc" letter-spacing="2"><text x="65" y="209">01 / INTENT</text><text x="293" y="209">02 / MODEL</text><text x="521" y="209">03 / TOOL</text><text x="749" y="209">04 / WORKSPACE</text></g>
<g font-size="23" font-weight="600" fill="#f2f6fc"><text x="65" y="253">你提出意图</text><text x="293" y="253">模型选下一步</text><text x="521" y="253">工具实际操作</text><text x="749" y="253">工作区有变化</text></g>
<g font-size="14" fill="#a9b7c7"><text x="65" y="289">想找回收藏的链接</text><text x="293" y="289">调查、回答或执行</text><text x="521" y="289">读文件、运行命令</text><text x="749" y="289">文件、页面、产物</text></g>
<g stroke="#7bc9dc" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M234 255H264"/><path d="M462 255H492"/><path d="M690 255H720"/><path d="M821 341V388Q821 411 798 411H159Q137 411 137 390V341"/></g>
<rect x="320" y="386" width="323" height="47" rx="4" fill="#0e1522" stroke="#b56750"/><text x="481" y="416" text-anchor="middle" fill="#ff997a" font-size="17">观察结果 → 判断证据 → 调整方向</text>
<path d="M44 473H914" stroke="#314052"/><text x="44" y="510" fill="#ff997a" font-size="15" font-weight="600">四件事要分别判断</text><text x="44" y="544" fill="#c6d2df" font-size="14">模型说了什么  /  工具查了什么  /  文件改了什么  /  使用时是否符合目标</text><text x="44" y="575" fill="#8294aa" font-size="12">只读调查也可以是有效行动；没有文件修改，不等于没有获得新事实。</text></g></svg>
