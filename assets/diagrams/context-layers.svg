<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" viewBox="0 0 680 820" role="img" aria-labelledby="title desc"><title id="title">上下文要让行动有依据</title><desc id="desc">当前任务：目标、允许范围、这次要验证什么：写在当前任务说明中。。项目约定：长期有效的运行方式与边界：写入项目 AGENTS.md，避免混入一次性状态。。当前事实：入口、实际输入、测试结果与差异：来自读取和执行；引用具体路径。。接续记录：停在哪里、未解问题、下一项检查：新会话先复核，再决定是否沿用。</desc><rect width="680" height="820" rx="6" fill="#0b101c"/><g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><text x="30" y="37" fill="#7bc9dc" font-size="11" letter-spacing="2">CODEX MASTERY LAB / FIG. 03</text><text x="30" y="80" fill="#f2f6fc" font-size="27" font-weight="700">上下文要让行动有依据</text><text x="30" y="113" fill="#afbed0" font-size="14">同一件事放在最合适的位置，减少重复与过期。</text><g transform="translate(30 155)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">01 / 当前任务</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">目标、允许范围、这次要验证什么</text><text x="24" y="93" fill="#afbed0" font-size="14">写在当前任务说明中。</text></g><path d="M340 274v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 298)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">02 / 项目约定</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">长期有效的运行方式与边界</text><text x="24" y="93" fill="#afbed0" font-size="14">写入项目 AGENTS.md，避免混入一次性状态。</text></g><path d="M340 417v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 441)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">03 / 当前事实</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">入口、实际输入、测试结果与差异</text><text x="24" y="93" fill="#afbed0" font-size="14">来自读取和执行；引用具体路径。</text></g><path d="M340 560v17m-5-5 5 5 5-5" stroke="#7bc9dc" fill="none" stroke-width="1.5"/><g transform="translate(30 584)"><rect width="620" height="118" rx="5" fill="#151e2b" stroke="#354456"/><text x="24" y="31" fill="#ff997a" font-size="12" letter-spacing="2">04 / 接续记录</text><text x="24" y="62" fill="#eef3fa" font-size="19" font-weight="600">停在哪里、未解问题、下一项检查</text><text x="24" y="93" fill="#afbed0" font-size="14">新会话先复核，再决定是否沿用。</text></g><path d="M30 752H650" stroke="#354456"/><text x="30" y="784" fill="#7bc9dc" font-size="12">文件存在 ≠ 内容已读取；历史记录 ≠ 当前状态。</text></g></svg>